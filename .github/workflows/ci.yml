name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-import-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Matches the Python version on the Pi (zero.local), so this catches
      # dependency/syntax incompatibilities before they surface there.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check .

      - name: Import check (cogs load without errors)
        run: python scripts/check_imports.py

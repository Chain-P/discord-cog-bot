{% extends "base.html" %}
{% block content %}
  <header>
    <h1>Server settings</h1>
    <a href="{{ url_for('index') }}">&larr; back</a>
  </header>

  <form method="post" action="{{ url_for('update_guild_settings', gid=gid) }}">
    <label for="prefix">Command prefix</label>
    <input type="text" id="prefix" name="prefix" value="{{ current_prefix }}" maxlength="5">

    <label for="mod_role_id">Moderator role</label>
    <select id="mod_role_id" name="mod_role_id">
      <option value="">-- none --</option>
      {% for role in roles %}
        <option value="{{ role.id }}" {% if role.id == current_mod_role_id %}selected{% endif %}>{{ role.name }}</option>
      {% endfor %}
    </select>

    <label for="birthday_channel_id">Birthday announcement channel</label>
    <select id="birthday_channel_id" name="birthday_channel_id">
      <option value="">-- none --</option>
      {% for channel in channels %}
        <option value="{{ channel.id }}" {% if channel.id|int == current_birthday_channel_id %}selected{% endif %}>#{{ channel.name }}</option>
      {% endfor %}
    </select>

    <button type="submit">Save</button>
  </form>
{% endblock %}
